<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizzlyUnivers - Mode Aléatoire</title>
    <meta name="description" content="Mode aléatoire : 10 questions tirées au hasard parmi tous les thèmes de QuizzlyUnivers.">
    <meta name="theme-color" content="#0b0f1a">
    <meta name="author" content="Esteban Cruz">
    <link rel="canonical" href="https://quizzlyunivers.fr/quiz-aleatoire.html">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="QuizzlyUnivers">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:title" content="QuizzlyUnivers - Mode Aléatoire">
    <meta property="og:description" content="Mode aléatoire : 10 questions tirées au hasard parmi tous les thèmes de QuizzlyUnivers.">
    <meta property="og:url" content="https://quizzlyunivers.fr/quiz-aleatoire.html">
    <meta property="og:image" content="https://quizzlyunivers.fr/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="QuizzlyUnivers - Mode Aléatoire">
    <meta name="twitter:description" content="Mode aléatoire : 10 questions tirées au hasard parmi tous les thèmes de QuizzlyUnivers.">
    <meta name="twitter:image" content="https://quizzlyunivers.fr/og-image.png">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo" onclick="location.href='index.html'">⚡ QuizzlyUnivers</div>
            <ul class="nav-menu">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="javascript:void(0)" class="suggestion-button" onclick="suggestNewTheme()">Proposer<span class="nav-long">&nbsp;un thème</span></a></li>
                <li><a href="javascript:void(0)" class="report-button" onclick="openReportModal()">🐛 Signaler<span class="nav-long">&nbsp;/ Suggérer</span></a></li>
                <li><a href="https://ko-fi.com/estebancruz0712" class="nav-support" target="_blank" rel="noopener noreferrer">♥ Soutenir</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="quiz-container">

            <!-- Quiz Section -->
            <div id="quiz-container">
                <div class="quiz-header" id="quiz-header">
                    <h1>🎲 Mode Aléatoire</h1>
                    <p>10 questions piochées au hasard dans tous les thèmes</p>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p style="text-align: center; margin-bottom: 1rem; color: #94a3b8;" id="progress-text"></p>

                <div class="question-card" id="question-container">
                    <!-- Les questions seront générées ici par JavaScript -->
                </div>

                <div class="button-container">
                    <button id="next-button" class="btn btn-primary">Suivante →</button>
                </div>
            </div>

            <!-- Résultats -->
            <div id="results-container" class="results-container" style="display: none;">
                <div class="results-header">
                    <h2>🎉 Quiz Terminé !</h2>
                    <p id="results-message"></p>
                </div>

                <div class="results-score">
                    <div class="score-circle">
                        <span id="score-percentage">0%</span>
                    </div>
                    <div class="score-details">
                        <p><strong id="score-text">0/10</strong> bonnes réponses</p>
                        <p id="performance-message"></p>
                    </div>
                </div>

                <div id="review-section" class="review-section"></div>

                <div class="button-container">
                    <button class="btn btn-primary" onclick="relaunchRandom()">🎲 Nouvelle partie aléatoire</button>
                    <button class="btn btn-secondary" onclick="location.href='index.html'">Retour à l'accueil</button>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 QuizzlyUnivers — L'Univers du Quizz</p>
    </footer>

    <script src="questions.js" defer></script>
    <script src="script.js" defer></script>
    <script src="animations.js" defer></script>
    <script>
        function relaunchRandom() {
            document.getElementById('results-container').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            startRandomQuiz();
        }
    </script>
</body>
</html>
